{% load i18n %}
<div class="bom-type-picker" data-bom-type-picker data-selected-kind="{{ widget.selected_kind }}">
  <div class="bom-type-picker-kind" role="group" aria-label="{% trans 'Material Type' %}">
    <span class="bom-type-picker-thumb" data-kind-thumb data-at="{{ widget.selected_kind }}" aria-hidden="true"></span>
    <button
      type="button"
      class="bom-type-picker-kind-btn"
      data-kind="product"
      aria-pressed="{% if widget.selected_kind == 'product' %}true{% else %}false{% endif %}"
    >{{ widget.product_label }}</button>
    <button
      type="button"
      class="bom-type-picker-kind-btn"
      data-kind="raw"
      aria-pressed="{% if widget.selected_kind == 'raw' %}true{% else %}false{% endif %}"
    >{{ widget.raw_label }}</button>
  </div>
  <div class="bom-type-picker-subtypes" data-subtypes hidden>
    <label class="bom-label" for="{{ widget.attrs.id }}-subtype">{% trans "Product type" %}</label>
    <select
      id="{{ widget.attrs.id }}-subtype"
      class="bom-input bom-type-picker-select"
      data-subtype-select
      aria-label="{% trans 'Product type' %}"
    ></select>
  </div>
  {# Real form field: keep radios for POST + create-part toggles; select mirrors them. #}
  <div class="bom-type-picker-radios"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} hidden>
    {% for group, options, index in widget.optgroups %}
      {% for option in options %}
        {% include option.template_name with widget=option %}
      {% endfor %}
    {% endfor %}
  </div>
</div>
